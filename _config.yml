title: "Department Seminar Series"
description: "Fall 2026 seminar schedule, calendar, and flyers"
baseurl: "" # subpath, e.g. "/seminars" if hosted at username.github.io/seminars — leave "" for a root site
url: "" # e.g. "https://yourusername.github.io"

# --- Collections ---
# Every markdown file in _seminars/ becomes one seminar page.
collections:
  seminars:
    output: true
    permalink: /seminars/:path/

defaults:
  - scope:
      path: ""
      type: seminars
    values:
      layout: seminar

# --- Build settings ---
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
