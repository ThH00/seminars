title: "Department Seminar Series"
description: "Fall 2026 seminar schedule, calendar, and flyers"
baseurl: "/seminars" # subpath, e.g. "/seminars" if hosted at username.github.io/seminars — leave "" for a root site
future: true # without this, Jekyll silently hides any seminar dated after today — required since this site lists upcoming talks
url: "https://thh00.github.io" # e.g. "https://yourusername.github.io" — DOMAIN ONLY, no /seminars here (baseurl handles that)

# --- Collections ---
# Every markdown file in _seminars/ becomes one seminar page.
collections:
  seminars:
    output: true
    permalink: /seminars/:path/

defaults:
  - scope:
      path: ""
      type: seminars
    values:
      layout: seminar

# --- Build settings ---
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - TEMPLATE.md
  - vendor
